    body {

    /* Background for ALL category grids, Hi, This is Eliezer, I made this website. */
#category-grid {
  background-image: url("background.png");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  border-radius: 1.5rem;
}

#menu-items-container {
  background-image: url("background.png");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  min-height: 100vh;
}

/* Optional soft overlay */
#menu-items-container {
  position: relative;
}

#menu-items-container::before {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(240, 253, 244, 0.5);
}

#menu-items-container > * {
  position: relative;
  z-index: 1;
}

/* Optional overlay for readability */
#category-grid {
  position: relative;
}

#category-grid > * {
  position: relative;
  z-index: 1;
}
    @font-face {
      font-family: 'Ultra';
      src: url('https://fonts.gstatic.com/s/ultra/v23/zOLy4prXmrtY-tT6.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
    }
    
    .font-ultra {
      font-family: 'Ultra', serif;
    }
    
    .font-league {
      font-family: 'League Spartan', sans-serif;
    }
    
    .category-card {
      aspect-ratio: 1;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }
    
    .category-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
    }
    
    .category-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(134, 239, 172, 0..01) 0%, rgba(74, 222, 128, 0.8) 100%);
      z-index: 1;
    }
    
    .category-label {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 1rem;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.8), transparent);
      z-index: 2;
    }
    
    .sidebar-mode {
      position: fixed;
      top: 100px;
      left: 0;
      width: 224px;
      height: calc(100% - 100px);
      overflow-y: auto;
      z-index: 40;
      transition: transform 0.3s ease;
    }
    
    .content-mode {
      margin-left: 224px;
      transition: margin-left 0.3s ease;
    }
    
    .sidebar-card {
      aspect-ratio: auto;
      padding: 1rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    
    .sidebar-card:hover {
      transform: none;
      background-color: rgba(134, 239, 172, 0.6);
    }
    
    .sidebar-card.active {
      background-color: rgba(21, 128, 61, 0.2);
      border-left: 4px solid #15803d;
    }
    
    @media (max-width: 768px) {
      .sidebar-mode {
        width: 100%;
        height: auto;
        position: sticky;
        top: 88px;
        display: flex;
        overflow-x: auto;
        overflow-y: hidden;
        padding: 0.75rem;
        gap: 0.75rem;
        background: rgba(220, 252, 231, 0.98);
        backdrop-filter: blur(8px);
      }
      
      .sidebar-card {
        min-width: 110px;
        width: 110px;
        height: 110px;
        flex-shrink: 0;
        aspect-ratio: 1;
        padding: 0.75rem;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      
      .sidebar-card .flex {
        flex-direction: column;
        gap: 0.375rem;
        text-align: center;
      }
      
      .sidebar-card span:first-child {
        font-size: 2rem;
      }
      
      .sidebar-card span:last-child {
        font-size: 1.2rem;
        line-height: 1.2;
        font-weight: 600;
      }
      
      .content-mode {
        margin-left: 0;
      }
    }
    
    .menu-content {
      animation: fadeIn 0.4s ease;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .option-btn {
      transition: all 0.2s ease;
    }
    
    .option-btn.selected {
      background-color: #15803d;
      color: white;
      border-color: #15803d;
    }
    
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    
    ::-webkit-scrollbar-track {
      background: #dcfce7;
    }
    
    ::-webkit-scrollbar-thumb {
      background: #86efac;
      border-radius: 4px;
    }
    
    ::-webkit-scrollbar-thumb:hover {
      background: #4ade80;
    }

    function renderCategoryGrid() {
      const grid = document.getElementById('category-grid-container');
      grid.innerHTML = '';

      Object.entries(menuData).forEach(([key, category]) => {
        const card = document.createElement('div');
        card.className = 'category-card bg-green-300 rounded-2xl border-2 border-green-400/50 shadow-xl cursor-pointer';
        card.onclick = () => selectCategory(key);
        
        card.innerHTML = `
          <img src="${category.name}.png" alt="${category.name}" class="w-full h-full object-cover rounded-xl" loading="lazy" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
          <div class="w-full h-full border-4 border-dashed border-green-500/50 rounded-xl flex items-center justify-center bg-green-200/30" style="display: flex;">

            </svg>
          </div>
          <div class="category-label">
            <div class="flex items-center gap-2 justify-center">
              <span class="text-2xl md:text-3xl">${category.icon}</span>
              <span class="text-sm md:text-base font-bold text-white text-center">${category.name}</span>
            </div>
          </div>
        `;
        
        grid.appendChild(card);
      });
    }

    function renderSidebar() {
      const sidebar = document.getElementById('category-sidebar');
      sidebar.innerHTML = '';

      Object.entries(menuData).forEach(([key, category]) => {
        const card = document.createElement('div');
        card.className = `sidebar-card bg-green-200/60 border-b border-green-300/30 ${currentCategory === key ? 'active' : ''}`;
        card.onclick = () => selectCategory(key);
        
        card.innerHTML = `
          <div class="flex items-center gap-3">
            <span class="text-2xl">${category.icon}</span>
            <span class="text-sm md:text-base font-semibold text-green-900">${category.name}</span>
          </div>
        `;
        
        sidebar.appendChild(card);
      });
    }

    function renderMenuItems() {
      const container = document.getElementById('menu-items-container');
      if (!currentCategory || !menuData[currentCategory]) {
        container.innerHTML = '';
        return;
      }

      const category = menuData[currentCategory];
      
      let itemsHtml = '';
      if (category.subcategories) {
        itemsHtml = category.subcategories.map(sub => `
          <div class="mb-8">
            <h3 class="text-green-700 font-bold text-xl md:text-2xl mb-4 border-b-2 border-green-300/50 pb-2 uppercase">${sub.name}</h3>
            <div class="space-y-4">
              ${sub.items.map(item => renderMenuItem(currentCategory, item)).join('')}
            </div>
          </div>
        `).join('');
      } else {
        itemsHtml = `
          <div class="space-y-4">
            ${category.items.map(item => renderMenuItem(currentCategory, item)).join('')}
          </div>
        `;
      }

      container.innerHTML = `
        <div class="menu-content max-w-4xl">
          <button onclick="returnToCategories()" class="mb-6 flex items-center gap-2 bg-green-200/60 hover:bg-green-300/60 text-green-900 font-semibold py-3 px-6 rounded-lg transition-colors border border-green-300/50">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
            </svg>
            Return to Categories
          </button>
          <div class="mb-6"><center>
            <h2 class="text-5xl md:text-4xl font-bold text-green-700">${category.name}</h2></center>
          </div>
          ${itemsHtml}
          <button onclick="returnToCategories()" class="mt-8 flex items-center gap-2 bg-green-200/60 hover:bg-green-300/60 text-green-900 font-semibold py-3 px-6 rounded-lg transition-colors border border-green-300/50">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
            </svg>
            Return to Categories
          </button>
        </div>
      `;
    }

    function renderMenuItem(categoryKey, item) {
      const itemKey = `${categoryKey}-${item.name.replace(/\s+/g, '-').toLowerCase()}`;
      const currentSelection = selectedOptions[itemKey];
      
      let priceDisplay = '';
      if (item.price !== null) {
        priceDisplay = `₱${item.price}`;
        if (item.familyPrice) {
          priceDisplay += ` <span class="text-yellow-300 text-sm">/ Family Size ₱${item.familyPrice}</span>`;
        }
      }
      
      let optionsHtml = '';
      if (item.options) {
        optionsHtml = `
          <div class="mt-3 flex flex-wrap items-center gap-2">
            <span class="text-green-300 text-sm font-medium">${item.options.label}:</span>
            ${item.options.choices.map(choice => `
              <button 
                class="option-btn px-4 py-2 text-sm rounded-full border-2 border-green-500 text-white hover:bg-green-600 ${currentSelection === choice ? 'selected' : ''}"
                onclick="selectOption('${itemKey}', '${choice}', event)"
              >
                ${choice}
              </button>
            `).join('')}
          </div>
        `;
      }
      
      let descriptionHtml = '';
      if (item.description) {
        descriptionHtml = `<p class="text-green-300 text-sm mt-1">${item.description}</p>`;
      }
      
      return `
        <div class="bg-green-800 rounded-xl p-4 md:p-6 border border-green-700/50 hover:bg-green-700 transition-colors">
          <div class="flex flex-col sm:flex-row sm:justify-between sm:items-start gap-2">
            <div class="flex-1">
              <h4 class="text-white font-semibold text-2xl">${item.name}</h4>
              ${descriptionHtml}
            </div>
            <span class="text-yellow-400 font-bold text-2xl whitespace-nowrap">${priceDisplay}</span>
          </div>
          ${optionsHtml}
        </div>
      `;
    }

    function selectCategory(key) {
      currentCategory = key;
      
      document.getElementById('category-grid').classList.add('hidden');
      document.getElementById('sidebar-view').classList.remove('hidden');
      
      renderSidebar();
      renderMenuItems();
      
      // Scroll to top immediately
      window.scrollTo({ top: 0, behavior: 'instant' });
      const appContainer = document.getElementById('app-container');
      if (appContainer) {
        appContainer.scrollTop = 0;
      }
    }

    function selectOption(itemKey, choice, event) {
      event.stopPropagation();
      selectedOptions[itemKey] = selectedOptions[itemKey] === choice ? null : choice;
      renderMenuItems();
    }

    function toggleMenu() {
      const dropdown = document.getElementById('dropdown-menu');
      dropdown.classList.toggle('hidden');
    }

    function returnToCategories() {
      currentCategory = null;
      document.getElementById('sidebar-view').classList.add('hidden');
      document.getElementById('category-grid').classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Close dropdown when clicking outside
    document.addEventListener('click', function(event) {
      const menuToggle = document.getElementById('menu-toggle');
      const dropdown = document.getElementById('dropdown-menu');
      
      if (menuToggle && dropdown && !menuToggle.contains(event.target) && !dropdown.contains(event.target)) {
        dropdown.classList.add('hidden');
      }
    });

    async function onConfigChange(config) {
      const restaurantName = document.getElementById('restaurant-name');
      const restaurantTagline = document.getElementById('restaurant-tagline');
      const appContainer = document.getElementById('app-container');
      const header = document.getElementById('sticky-header');
      const baseSize = config.font_size || defaultConfig.font_size;

      if (restaurantName) {
        restaurantName.textContent = config.restaurant_name || defaultConfig.restaurant_name;
        restaurantName.style.color = config.accent_color || defaultConfig.accent_color;
        restaurantName.style.fontSize = `${baseSize * 2}px`;
      }

      if (restaurantTagline) {
        restaurantTagline.textContent = config.restaurant_tagline || defaultConfig.restaurant_tagline;
        restaurantTagline.style.fontSize = `${baseSize * 0.875}px`;
      }

      if (appContainer) {
        appContainer.style.backgroundColor = config.background_color || defaultConfig.background_color;
        appContainer.style.color = config.text_color || defaultConfig.text_color;
        const customFont = config.font_family || defaultConfig.font_family;
        appContainer.style.fontFamily = `${customFont}, Arial, sans-serif`;
        appContainer.style.fontSize = `${baseSize}px`;
      }

      if (header) {
        header.style.backgroundColor = (config.header_color || defaultConfig.header_color) + 'f2';
      }
    }

    function mapToCapabilities(config) {
      return {
        recolorables: [
          {
            get: () => config.background_color || defaultConfig.background_color,
            set: (value) => {
              config.background_color = value;
              if (window.elementSdk) window.elementSdk.setConfig({ background_color: value });
            }
          },
          {
            get: () => config.card_color || defaultConfig.card_color,
            set: (value) => {
              config.card_color = value;
              if (window.elementSdk) window.elementSdk.setConfig({ card_color: value });
            }
          },
          {
            get: () => config.text_color || defaultConfig.text_color,
            set: (value) => {
              config.text_color = value;
              if (window.elementSdk) window.elementSdk.setConfig({ text_color: value });
            }
          },
          {
            get: () => config.accent_color || defaultConfig.accent_color,
            set: (value) => {
              config.accent_color = value;
              if (window.elementSdk) window.elementSdk.setConfig({ accent_color: value });
            }
          },
          {
            get: () => config.header_color || defaultConfig.header_color,
            set: (value) => {
              config.header_color = value;
              if (window.elementSdk) window.elementSdk.setConfig({ header_color: value });
            }
          }
        ],
        borderables: [],
        fontEditable: {
          get: () => config.font_family || defaultConfig.font_family,
          set: (value) => {
            config.font_family = value;
            if (window.elementSdk) window.elementSdk.setConfig({ font_family: value });
          }
        },
        fontSizeable: {
          get: () => config.font_size || defaultConfig.font_size,
          set: (value) => {
            config.font_size = value;
            if (window.elementSdk) window.elementSdk.setConfig({ font_size: value });
          }
        }
      };
    }

    function mapToEditPanelValues(config) {
      return new Map([
        ['restaurant_name', config.restaurant_name || defaultConfig.restaurant_name],
        ['restaurant_tagline', config.restaurant_tagline || defaultConfig.restaurant_tagline]
      ]);
    }

    // Initialize
    renderCategoryGrid();

    if (window.elementSdk) {
      window.elementSdk.init({
        defaultConfig,
        onConfigChange,
        mapToCapabilities,
        mapToEditPanelValues
      });
    }
  </script>
